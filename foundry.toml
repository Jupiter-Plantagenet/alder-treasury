[profile.default]
src = "contracts/src"
test = "contracts/test"
out = "contracts/out"
libs = ["node_modules"]
solc_version = "0.8.24"
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200
remappings = ["@openzeppelin/=node_modules/@openzeppelin/", "@safe-global/safe-contracts/=vendor/safe-1.4.1/"]
[fuzz]
runs = 1000
[profile.default.invariant]
runs = 1000
depth = 128
fail_on_revert = true
